<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Team Poll</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>📊 Live Team Poll</h1>
      <p id="total-votes">Total votes: 0</p>
    </header>

    <section class="card">
      <h2 id="poll-question">What should our team build next sprint?</h2>
      <div id="options-list" class="options-list"></div>
    </section>

    <section class="card">
      <h3>Add a New Option</h3>
      <form id="add-option-form" class="form-row">
        <input
          type="text"
          id="new-option-input"
          placeholder="Enter an option..."
          required
        />
        <button type="submit">Add Option</button>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
